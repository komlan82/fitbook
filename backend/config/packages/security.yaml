security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            entry_point: App\Security\ApiEntryPoint
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: api_logout

    # Contrôle des permissions par rôle (le premier motif qui correspond s'applique)
    access_control:
        - { path: ^/api/(login|register|confirm|contact|health|sauvegardes), roles: PUBLIC_ACCESS }
        - { path: ^/api/salles, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/(calendrier|coachs), methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api/gestionnaire, roles: ROLE_GESTIONNAIRE }
        - { path: ^/api/coach, roles: ROLE_COACH }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
